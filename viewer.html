<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>azuredefendertree</title>
<style>
:root {
  color-scheme: dark;
  --bg:#0d1016;--frame:#050608;--panel:#11151c;--line:#222835;--text:#d6dae2;--muted:#7c8494;--dim:#555e70;
  --accent:#fd8ea1;--full:#45b585;--partial:#e0a449;--none:#df625f;--enabled:#7789bb;--unknown:#778191;
  --compute:#bd6f7e;--storage:#5a8fca;--database:#a36fc4;--containers:#4fa794;--apps:#c89550;--other:#778191;
}
*{box-sizing:border-box} html,body{height:100%;margin:0;background:var(--frame);color:var(--text);font:12px/1.35 "Segoe UI",system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums;overflow:hidden}
button,input{font:inherit}.app{position:fixed;inset:10px;display:grid;grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:auto auto minmax(0,1fr) auto;background:var(--bg);border:1px solid var(--line);border-radius:9px;overflow:hidden}
header{grid-column:1/-1;display:flex;align-items:center;gap:12px;min-width:0;padding:9px 13px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:15px;font-weight:600}.logo{display:grid;grid-template-columns:7px 7px;gap:2px}.logo i{width:7px;height:7px;border-radius:1px}.crumbs{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;color:var(--dim);white-space:nowrap}.crumbs button{border:0;background:none;color:var(--muted);padding:0;cursor:pointer}.crumbs button:hover{color:var(--text)}.crumbs .current{overflow:hidden;text-overflow:ellipsis;color:var(--text);background:#1b212c;border-radius:4px;padding:2px 7px}.spacer{flex:1}
.views{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:6px;white-space:nowrap}.views button,.export{border:0;background:transparent;color:var(--muted);padding:4px 9px;border-radius:4px;cursor:pointer}.views button.on{background:#252c3a;color:var(--text)}.views button:hover,.export:hover{color:var(--text)}.export{border:1px solid var(--line);padding:5px 9px;white-space:nowrap}
#filter{width:170px;border:1px solid var(--line);border-radius:5px;outline:none;background:#090c11;color:var(--text);padding:5px 8px}#filter:focus{border-color:#505b71}
.summary{display:flex;align-items:center;gap:16px;min-width:0;overflow:hidden;white-space:nowrap;padding:7px 13px 6px;color:var(--muted)}.summary b{color:var(--text);font-weight:600}.legend{display:flex;gap:11px;margin-left:auto}.legend span{display:flex;align-items:center;gap:5px}.legend i{width:8px;height:8px;border-radius:2px}
#map{position:relative;min-height:0;margin:2px 8px 8px 11px}.cell{position:absolute;overflow:hidden;cursor:pointer;border-radius:2px}.group{background:color-mix(in srgb,var(--c) 9%,var(--bg));border:1px solid color-mix(in srgb,var(--c) 36%,var(--bg));border-top:2px solid color-mix(in srgb,var(--c) 78%,var(--bg))}.leaf{padding:3px 5px;background:color-mix(in srgb,var(--coverage) 24%,var(--bg));border:1px solid color-mix(in srgb,var(--coverage) 56%,var(--bg))}.leaf:hover{background:color-mix(in srgb,var(--coverage) 38%,var(--bg))}.cell.sel{outline:2px solid #f4f5f8;outline-offset:-2px;z-index:3}.gh{height:18px;display:flex;justify-content:space-between;gap:6px;padding:1px 5px;white-space:nowrap}.gh .name,.leaf .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gh .name{font-weight:600}.gh .value,.leaf .meta{font-size:10.5px;color:var(--muted);white-space:nowrap}.leaf .name{color:#edf0f5}.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}
aside{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;gap:18px;overflow-y:auto;padding:14px 16px;background:var(--panel);border-left:1px solid var(--line)}section{min-width:0}.eyebrow{display:flex;justify-content:space-between;color:var(--dim);font-size:10px;letter-spacing:.75px;text-transform:uppercase}.selection-name{margin-top:8px;padding-left:8px;border-left:2px solid var(--accent);font-size:16px;overflow-wrap:anywhere}.context{margin:3px 0 0 10px;color:var(--muted);overflow-wrap:anywhere}.big{margin-top:9px;font-size:31px;font-weight:300;letter-spacing:-.5px}.costbar{height:4px;margin-top:7px;overflow:hidden;border-radius:3px;background:#202633}.costbar i{display:block;height:100%;background:var(--accent)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:11px 9px;margin-top:13px}.stats span,.field span{display:block;margin-bottom:2px;color:var(--dim);font-size:9.5px;letter-spacing:.55px;text-transform:uppercase}.badge{display:inline-block;padding:1px 6px;border:1px solid color-mix(in srgb,var(--badge) 55%,transparent);border-radius:4px;color:var(--badge)}.fields{display:grid;gap:9px;margin-top:14px}.field div{overflow-wrap:anywhere}.arm{font:10.5px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;color:#aab1bf;word-break:break-all}.extensions{display:flex;flex-wrap:wrap;gap:4px}.chip{padding:1px 5px;border:1px solid var(--line);border-radius:4px;color:var(--muted);font-size:10.5px}.plan{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;margin-top:10px;padding-left:8px;border-left:2px solid var(--c)}.plan .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.plan .pc{text-align:right}.plan .ps{color:var(--muted);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.error{margin-top:9px;padding-left:8px;border-left:2px solid var(--none);color:#c8cbd2}.error b{display:block;color:#e1e3e8;font-weight:500}.empty-side{color:var(--muted)}
footer{grid-column:1/-1;display:flex;align-items:center;gap:13px;overflow-x:auto;padding:7px 13px;border-top:1px solid var(--line);color:var(--dim);white-space:nowrap}footer::-webkit-scrollbar{height:3px}kbd{margin-right:4px;padding:0 4px;border:1px solid var(--line);border-radius:3px;color:var(--muted);font:10px ui-monospace,Consolas,monospace}.demo{padding:1px 6px;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:4px;color:var(--accent)}
#tip{position:fixed;z-index:20;display:none;max-width:580px;padding:8px 10px;border:1px solid #31394a;border-radius:6px;background:#191e28;box-shadow:0 8px 28px #0009;pointer-events:none}#tip .title{font-weight:600;overflow-wrap:anywhere}#tip .line{margin-top:3px;color:var(--muted)}#tip .tip-id{margin-top:5px;font:10.5px/1.4 ui-monospace,Consolas,monospace;color:#aeb5c2;overflow-wrap:anywhere;word-break:break-all}
@media(max-width:980px){html,body{overflow:auto}.app{position:relative;inset:auto;min-height:calc(100vh - 12px);margin:6px;grid-template-columns:1fr;grid-template-rows:auto auto 62vh auto auto;overflow:visible}.summary{grid-column:1}.legend{display:none}aside{grid-column:1;grid-row:4;max-height:none;border-left:0;border-top:1px solid var(--line)}footer{grid-row:5}header{flex-wrap:wrap}.crumbs{order:3;width:100%}.spacer{display:none}#filter{margin-left:auto}}
@media(max-width:620px){.views{order:4;width:100%;overflow-x:auto}.views button{flex:1}.export{margin-left:auto}#filter{width:130px}.summary{gap:9px}.summary .secondary{display:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="logo" aria-hidden="true"><i style="background:var(--compute)"></i><i style="background:var(--storage)"></i><i style="background:var(--database)"></i><i style="background:var(--containers)"></i></span>azuredefendertree</div>
    <div class="crumbs" id="crumbs"></div><div class="spacer"></div>
    <div class="views" id="views" aria-label="Treemap grouping">
      <button data-view="subcategory">Subcategory</button><button data-view="subscription">Subscription</button><button data-view="resourceType">Resource type</button><button data-view="coverage">Coverage</button>
    </div>
    <button class="export" id="export">Export for AI</button>
    <input id="filter" type="search" placeholder="filter  /" aria-label="Filter resources" autocomplete="off" spellcheck="false">
  </header>
  <div class="summary" id="summary"></div>
  <main id="map" aria-label="Defender CostUSD treemap"></main>
  <aside id="details"></aside>
  <footer>
    <span><kbd>click</kbd>select</span><span><kbd>double-click</kbd><kbd>enter</kbd>open</span><span><kbd>backspace</kbd>up</span>
    <span><kbd>1</kbd>–<kbd>4</kbd>view</span><span><kbd>/</kbd>filter</span><span><kbd>e</kbd>export</span><span><kbd>esc</kbd>clear</span>
    <span class="spacer"></span><span id="footer-meta"></span>
  </footer>
</div>
<div id="tip" role="tooltip"></div>
<script>
const DATA=__AZUREDEFENDERTREE_DATA__;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const priced=DATA.resources.filter(r=>Number.isFinite(r.costUsd)&&r.costUsd>0),fullTotal=DATA.totalCostUsd||priced.reduce((s,r)=>s+r.costUsd,0);
const state={view:"subcategory",filter:"",zoom:null,selection:null};
const viewLabels={subcategory:"Subcategory",subscription:"Subscription",resourceType:"Resource type",coverage:"Coverage"};
const coverageColor={"Fully covered":"var(--full)","Partially covered":"var(--partial)","Not covered":"var(--none)","Enabled":"var(--enabled)","Unknown":"var(--unknown)"};
const money=v=>new Intl.NumberFormat("en-US",{style:"currency",currency:DATA.currency||"USD",minimumFractionDigits:2,maximumFractionDigits:2}).format(v||0);
const pct=v=>`${(100*(v||0)).toFixed(v>=.1?1:2)}%`;
const family=r=>/VM|Resource Manager/i.test(r.category)?"compute":/Storage|Key Vault/i.test(r.category)?"storage":/SQL|database|Cosmos/i.test(r.category)?"database":/Container/i.test(r.category)?"containers":/App Service|API|CSPM|AI/i.test(r.category)?"apps":"other";
const groupKey=r=>state.view==="subcategory"?r.category:state.view==="subscription"?r.subscriptionName:state.view==="resourceType"?r.resourceTypeLabel:r.coverage;
const searchable=r=>[r.category,r.name,r.id,r.resourceType,r.resourceTypeLabel,r.resourceGroup,r.subscriptionName,r.coverage].join(" ").toLowerCase();
function buildTree(){const q=state.filter.toLowerCase(),groups=new Map();for(const r of priced){if(q&&!searchable(r).includes(q))continue;const key=groupKey(r)||"Unknown";let g=groups.get(key);if(!g){g={kind:"group",key,name:key,cost:0,children:[],family:family(r)};groups.set(key,g)}const leaf={kind:"resource",key:r.key,name:r.name,cost:r.costUsd,record:r,parent:g};g.children.push(leaf);g.cost+=leaf.cost}const children=[...groups.values()].sort((a,b)=>b.cost-a.cost||a.name.localeCompare(b.name));for(const g of children)g.children.sort((a,b)=>b.cost-a.cost||a.name.localeCompare(b.name));return{kind:"root",name:"All Defender cost",children,cost:children.reduce((s,g)=>s+g.cost,0)}}
let tree=buildTree();
function dominantCapped(nodes){if(nodes.length<2)return false;const ordered=nodes.slice().sort((a,b)=>b.cost-a.cost),rest=ordered.slice(1).reduce((s,n)=>s+n.cost,0);return rest>0&&ordered[0].cost>rest}
function squarify(nodes,x,y,w,h,capDominant=false){const out=[],ordered=nodes.slice().sort((a,b)=>b.cost-a.cost);let weighted=ordered.map(n=>({n,weight:n.cost}));if(capDominant&&dominantCapped(ordered)){const rest=weighted.slice(1).reduce((s,i)=>s+i.weight,0);weighted[0].weight=rest}const total=weighted.reduce((s,i)=>s+i.weight,0);if(total<=0||w<=0||h<=0)return out;let items=weighted.map(i=>({n:i.n,a:i.weight/total*w*h}));const worst=(row,side)=>{let sum=0,max=0,min=Infinity;for(const i of row){sum+=i.a;max=Math.max(max,i.a);min=Math.min(min,i.a)}return Math.max(side*side*max/(sum*sum),sum*sum/(side*side*min))};while(items.length){const side=Math.min(w,h);let row=[items[0]],best=worst(row,side),i=1;for(;i<items.length;i++){const score=worst([...row,items[i]],side);if(score>best)break;row.push(items[i]);best=score}items=items.slice(i);const area=row.reduce((s,v)=>s+v.a,0);if(w>=h){const rw=items.length?area/h:w;let cy=y;for(const item of row){const rh=item.a/rw;out.push({n:item.n,x,y:cy,w:rw,h:rh});cy+=rh}x+=rw;w-=rw}else{const rh=items.length?area/w:h;let cx=x;for(const item of row){const rw=item.a/rh;out.push({n:item.n,x:cx,y,w:rw,h:rh});cx+=rw}y+=rh;h-=rh}}return out}
function place(el,r,gap){el.style.left=`${r.x+gap}px`;el.style.top=`${r.y+gap}px`;el.style.width=`${Math.max(0,r.w-gap*2)}px`;el.style.height=`${Math.max(0,r.h-gap*2)}px`}
function makeCell(cls,n,r,gap){const el=document.createElement("div");el.className=`cell ${cls}`;el._node=n;n._el=el;place(el,r,gap);return el}
function drawLeaf(frag,r){const n=r.n,el=makeCell("leaf",n,r,1);el.title=`${n.name} — ${money(n.cost)}`;el.style.setProperty("--coverage",coverageColor[n.record.coverage]||"var(--enabled)");if(r.w>28&&r.h>14)el.innerHTML=`<div class="name">${esc(n.name)}</div>${r.h>30&&r.w>48?`<div class="meta">${money(n.cost)}${r.w>135?` · ${esc(n.record.subscriptionName)}`:""}</div>`:""}`;frag.append(el)}
function drawGroup(frag,r){const n=r.n,el=makeCell("group",n,r,1.5);el.style.setProperty("--c",`var(--${n.family})`);frag.append(el);if(r.w>30&&r.h>16)el.innerHTML=`<div class="gh"><span class="name">${esc(n.name)}</span>${r.w>90?`<span class="value">${money(n.cost)}</span>`:""}</div>`;if(r.w>24&&r.h>28)for(const leaf of squarify(n.children,r.x+3,r.y+20,r.w-6,r.h-23))drawLeaf(frag,leaf)}
const currentZoom=()=>state.zoom?tree.children.find(g=>g.key===state.zoom):null;
function render(){const map=$("#map"),base=currentZoom()||tree,frag=document.createDocumentFragment();if(!base.children.length)map.innerHTML=`<div class="empty">${state.filter?`No priced resources match “${esc(state.filter)}”`:"No positive Defender CostUSD in this report"}</div>`;else{for(const r of squarify(base.children,0,0,map.clientWidth,map.clientHeight,base===tree))base===tree?drawGroup(frag,r):drawLeaf(frag,r);map.replaceChildren(frag)}if(state.selection?._el?.isConnected)state.selection._el.classList.add("sel");renderChrome(base);renderDetails()}
function renderChrome(base){document.querySelectorAll("#views button").forEach(b=>b.classList.toggle("on",b.dataset.view===state.view));$("#crumbs").innerHTML=base===tree?`<span>/</span><span class="current">all ${esc(viewLabels[state.view].toLowerCase())} groups</span>`:`<span>/</span><button data-up>all ${esc(viewLabels[state.view].toLowerCase())} groups</button><span>/</span><span class="current">${esc(base.name)}</span>`;const count=tree.children.reduce((s,g)=>s+g.children.length,0),legend=[["--full","fully covered"],["--partial","partially covered"],["--none","not covered"],["--enabled","enabled"],["--unknown","unknown"]].map(([c,l])=>`<span><i style="background:var(${c})"></i>${l}</span>`).join("");$("#summary").innerHTML=`<span><b>${money(tree.cost)}</b> · ${esc(DATA.periodStart)} – ${esc(DATA.periodEnd)}</span><span class="secondary">${count} priced resource boxes · ${tree.children.length} visible groups</span>${dominantCapped(tree.children)?`<span class="secondary">largest group visually capped at 50%</span>`:""}${state.filter?`<span>${pct(tree.cost/fullTotal)} of Defender cost</span>`:""}<div class="legend">${legend}</div>`}
function badge(coverage){return `<span class="badge" style="--badge:${coverageColor[coverage]||"var(--enabled)"}">${esc(coverage)}</span>`}
function groupStats(g){const rows=g.kind==="root"?g.children.flatMap(x=>x.children):g.children;return{rows,full:rows.filter(x=>x.record.coverage==="Fully covered").length,partial:rows.filter(x=>x.record.coverage==="Partially covered").length}}
function renderDetails(){const n=state.selection||currentZoom()||tree;let html="";if(n.kind==="resource"){const r=n.record;html=`<section><div class="eyebrow">Resource <b>${money(r.costUsd)}</b></div><div class="selection-name">${esc(r.name)}</div><div class="context">${esc(r.resourceTypeLabel)}</div><div class="big">${money(r.costUsd)}</div><div class="costbar"><i style="width:${Math.min(100,r.costUsd/fullTotal*100)}%"></i></div><div class="fields"><div class="field"><span>Coverage</span><div>${badge(r.coverage)}</div></div><div class="field"><span>Defender category</span><div>${esc(r.category)}</div></div><div class="field"><span>Plan</span><div>${esc(r.planDisplayName)}${r.subPlan?` · ${esc(r.subPlan)}`:""}</div></div><div class="field"><span>Subscription</span><div>${esc(r.subscriptionName)}</div></div><div class="field"><span>Resource group</span><div>${esc(r.resourceGroup||"—")}</div></div><div class="field"><span>Resource type</span><div>${esc(r.resourceTypeLabel)}<br><span style="text-transform:none;letter-spacing:0">${esc(r.resourceType)}</span></div></div><div class="field"><span>Location</span><div>${esc(r.location||"—")}</div></div><div class="field"><span>ARM ID</span><div class="arm">${esc(r.id)}</div></div><div class="field"><span>Enabled extensions</span><div class="extensions">${r.extensions.length?r.extensions.map(x=>`<span class="chip">${esc(x)}</span>`).join(""):"—"}</div></div></div></section>`}else{const s=groupStats(n),context=n.kind==="root"?(state.filter?`Filtered ${viewLabels[state.view]} view`:viewLabels[state.view]+" view"):`${viewLabels[state.view]} group`;html=`<section><div class="eyebrow">Selection</div><div class="selection-name">${esc(n.name)}</div><div class="context">${esc(context)}</div><div class="big">${money(n.cost)}</div><div style="color:var(--dim)">${pct(n.cost/fullTotal)} of Defender cost</div><div class="costbar"><i style="width:${Math.min(100,n.cost/fullTotal*100)}%"></i></div><div class="stats"><div><span>Priced resources</span>${s.rows.length}</div><div><span>Visible groups</span>${n.kind==="root"?n.children.length:1}</div><div><span>Fully covered</span>${s.full}</div><div><span>Partially covered</span>${s.partial}</div><div><span>Period</span>${esc(DATA.periodStart)}<br>${esc(DATA.periodEnd)}</div><div><span>Enabled plans</span>${DATA.plans.length}</div></div></section>`}html+=`<section><div class="eyebrow">Enabled Defender plans <b>${DATA.plans.length}</b></div>${DATA.plans.length?DATA.plans.map(p=>`<div class="plan" style="--c:${coverageColor[p.coverage]||"var(--enabled)"}"><div class="pn" title="${esc(p.planName)}">${esc(p.planDisplayName)}</div><div class="pc">${money(p.costUsd)}</div><div class="ps">${esc(p.subscriptionName)}${p.subPlan?` · ${esc(p.subPlan)}`:""}</div><div class="ps">${p.resourceCount} applicable</div></div>`).join(""):`<div class="empty-side">No enabled Standard plans collected.</div>`}</section>`;if(DATA.errors.length)html+=`<section><div class="eyebrow">Collection warnings <b>${DATA.errors.length}</b></div>${DATA.errors.map(e=>`<div class="error"><b>${esc(e.subscriptionName)} · ${esc(e.subscriptionId)}</b>${esc(e.message)}</div>`).join("")}</section>`;$("#details").innerHTML=html}
function select(n){if(state.selection?._el)state.selection._el.classList.remove("sel");state.selection=n;if(n?._el?.isConnected)n._el.classList.add("sel");renderDetails()}
function openNode(n){const g=n?.kind==="resource"?n.parent:n;if(g?.kind==="group"){state.zoom=g.key;state.selection=null;render()}}
function up(){if(state.zoom){const old=currentZoom();state.zoom=null;state.selection=old||null;render()}else if(state.selection)select(null)}
function setView(view){if(!viewLabels[view]||view===state.view)return;state.view=view;state.zoom=null;state.selection=null;tree=buildTree();render()}
$("#map").addEventListener("click",e=>select(e.target.closest(".cell")?._node||null));$("#map").addEventListener("dblclick",e=>{const cell=e.target.closest(".cell");if(cell)openNode(cell._node)});$("#views").addEventListener("click",e=>e.target.dataset.view&&setView(e.target.dataset.view));$("#crumbs").addEventListener("click",e=>e.target.closest("[data-up]")&&up());$("#filter").addEventListener("input",e=>{state.filter=e.target.value.trim();state.selection=null;tree=buildTree();if(state.zoom&&!currentZoom())state.zoom=null;render()});
document.addEventListener("keydown",e=>{const typing=e.target.matches("input,textarea,[contenteditable=true]");if(e.key==="Escape"){if(state.filter){$("#filter").value="";$("#filter").dispatchEvent(new Event("input"));$("#filter").blur()}else{state.selection=null;render()}return}if(typing||e.metaKey||e.ctrlKey||e.altKey)return;if(e.key==="/"){e.preventDefault();$("#filter").focus()}else if(e.key==="Enter")openNode(state.selection);else if(e.key==="Backspace"){e.preventDefault();up()}else if(e.key.toLowerCase()==="e")exportJson();else if(["1","2","3","4"].includes(e.key))setView(["subcategory","subscription","resourceType","coverage"][Number(e.key)-1])});
function exportPayload(){return{schemaVersion:"1.0",tool:"azuredefendertree",generated:DATA.generated,tenant:{name:DATA.tenantName,id:DATA.tenant},reportingPeriod:{start:DATA.periodStart,end:DATA.periodEnd,description:"Latest 30 complete UTC days"},currency:DATA.currency,totalCostUsd:DATA.totalCostUsd,subscriptionCount:DATA.subscriptionCount,enabledPlans:DATA.plans,pricedResources:priced,coveredResourcesWithoutPositiveCost:DATA.resources.filter(r=>!(r.costUsd>0)),collectionErrors:DATA.errors,interpretation:["CostUsd values and percentages are actual CostUSD; a dominant top-level treemap group is visually capped at 50% when it exceeds all other visible groups combined.","The period is the latest 30 complete UTC days.","General Azure costs are excluded; only Microsoft Defender and Microsoft Defender for Cloud ServiceName values are queried.","Enabled-plan resource counts include applicable resources without current positive cost.","Historical or inaccessible resource costs are consolidated by subscription and MeterSubCategory.","Partially covered does not mean every discovered resource is fully protected.","A nonempty collectionErrors array means the report is incomplete."]}}
function exportJson(){const blob=new Blob([JSON.stringify(exportPayload(),null,2)],{type:"application/json"}),a=Object.assign(document.createElement("a"),{href:URL.createObjectURL(blob),download:"azuredefendertree-export.json"});a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$("#export").addEventListener("click",exportJson);
const tip=$("#tip");$("#map").addEventListener("mousemove",e=>{const n=e.target.closest(".cell")?._node;if(!n||n.kind!=="resource"){tip.style.display="none";return}const r=n.record;tip.innerHTML=`<div class="title">${esc(r.name)}</div><div class="line">${esc(r.resourceTypeLabel)} · ${money(r.costUsd)} · ${esc(r.category)} · ${esc(r.subscriptionName)}</div><div class="tip-id">${esc(r.id)}</div>`;tip.style.display="block";const tw=tip.offsetWidth,th=tip.offsetHeight;tip.style.left=`${Math.max(8,Math.min(e.clientX+14,innerWidth-tw-8))}px`;tip.style.top=`${Math.max(8,Math.min(e.clientY+14,innerHeight-th-8))}px`});$("#map").addEventListener("mouseleave",()=>tip.style.display="none");
